version: '3.9'

services:

  backend:
    build: .

    container_name: wsp_backend

    command: >
      sh -c "
      python manage.py makemigrations &&
      python manage.py migrate &&
      gunicorn core.wsgi:application --bind 0.0.0.0:8000
      "

    volumes:
      - .:/app

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      - db

  db:
    image: postgres:16

    container_name: wsp_postgres

    environment:
      POSTGRES_DB: wsp_db
      POSTGRES_USER: wsp_user
      POSTGRES_PASSWORD: wsp_password

    ports:
      - "5432:5432"